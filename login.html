<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faça login para entrar no Task Dev</title>
    <link rel="stylesheet" href="css/style-login.css" />
  </head>
  <body>
    <form>
      <h1>Login</h1>
      <span>
        <label for="nome" method="POST">Nome de usuário</label>
        <input
          type="text"
          id="nome"
          name="nome"
          required
          placeholder="Digite o seu usuário"
        />
      </span>
      <span>
        <label for="senha" method="POST">Digite sua senha</label>
        <input
          type="text"
          id="senha"
          name="senha"
          required
          placeholder="Digite sua senha"
        />
      </span>
      <button type="submit">Entrar</button>
      <p>Ainda não tem uma conta? <a href="#">Clique aqui para criar uma</a></p>
    </form>
  </body>
</html>
